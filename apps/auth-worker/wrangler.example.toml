name = "mane-auth-staging"
main = "index.mjs"
compatibility_date = "2026-11-23"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "mane-auth-stg.disnana.com", custom_domain = true },
  { pattern = "dmm.disnana.com/api/shop/*", zone_name = "disnana.com" },
]

[vars]
MANE_AUTH_NODES = '[{"id":"staging-a","origin":"https://node-a-stg.disnana.com"},{"id":"staging-b","origin":"https://node-b-stg.disnana.com"}]'

# Set to 1 only after the Go nodes and Access Service Auth are ready.
MANE_WEB_SHOP_ENABLED = "0"
SITE_ORIGIN = "https://dmm.disnana.com"
MANE_SHOP_TEST_MODE = "0"
MANE_SHOP_PACKS = "[]"
# Worker secrets also used by the shop: MANE_SHOP_ACCESS_CLIENT_ID,
# MANE_SHOP_ACCESS_CLIENT_SECRET, GOOGLE_WEB_CLIENT_SECRET,
# STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET.
