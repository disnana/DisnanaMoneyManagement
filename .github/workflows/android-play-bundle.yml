name: Android Play bundle

on:
  workflow_call:
    inputs:
      staging_auth:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      staging_auth:
        description: Connect Android login to the staging service
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/android-play-bundle.yml'
      - 'apps/mobile/app.json'
      - 'apps/mobile/plugins/with-android-build-commit.js'
      - 'apps/mobile/modules/build-info/**'
      - 'apps/mobile/plugins/with-optional-portrait-feature.js'

permissions:
  contents: read

jobs:
  android-play-bundle:
    name: Build unsigned Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MANE_ANDROID_BUILD_COMMIT: ${{ github.sha }}
      MANE_AUTH_ENTRY: ${{ inputs.staging_auth && 'https://mane-auth-stg.disnana.com' || vars.MANE_AUTH_ENTRY }}
      MANE_GOOGLE_WEB_CLIENT_ID: ${{ inputs.staging_auth && '433981502913-fuq95bpmu1tf6sfir5ui28b0vrnk7npb.apps.googleusercontent.com' || vars.MANE_GOOGLE_WEB_CLIENT_ID }}
      MANE_GOOGLE_PROJECT_NUMBER: ${{ inputs.staging_auth && '433981502913' || vars.MANE_GOOGLE_PROJECT_NUMBER }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild --platform android --no-install
      - name: Build the bundle without Expo's development signing key
        working-directory: apps/mobile/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          text = path.read_text()
          begin = text.index('        release {')
          before, release = text[:begin], text[begin:]
          generated = '            signingConfig signingConfigs.debug\n'
          if release.count(generated) != 1:
              raise RuntimeError('Expo release signing template changed')
          path.write_text(before + release.replace(generated, '            signingConfig = null\n'))
          PY
          ./gradlew bundleRelease --no-daemon
      - name: Check that the bundle has no development signature
        working-directory: apps/mobile/android
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('app/build/outputs/bundle/release/app-release.aab') as bundle:
              signed = [entry for entry in bundle.namelist() if entry.upper().startswith('META-INF/')
                        and entry.upper().endswith(('.SF', '.RSA', '.DSA', '.EC'))]
              if signed:
                  raise RuntimeError('Expected an unsigned App Bundle')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mane-chan-unsigned-app-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
