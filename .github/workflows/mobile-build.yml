name: Mobile build (Android APK / iOS unsigned IPA)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (debug-signed; for sideloading/testing)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DMM-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  ios:
    name: iOS unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform ios
      - name: Build (no code signing)
        run: |
          WS=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr DMM-mobile-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DMM-mobile-ios-unsigned-ipa
          path: apps/mobile/DMM-mobile-unsigned.ipa
          retention-days: 30
