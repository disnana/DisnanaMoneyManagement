name: Android Play bundle

on:
  workflow_call:
    inputs:
      staging_auth:
        type: boolean
        default: false
      release_authority_checks:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      staging_auth:
        description: Connect Android login to the staging service
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/android-play-bundle.yml'
      - 'apps/mobile/app.json'
      - 'apps/mobile/release-verification/**'
      - 'release-authority/tools/aab-verifier/**'
      - 'apps/mobile/plugins/with-android-build-commit.js'
      - 'apps/mobile/modules/build-info/**'
      - 'apps/mobile/plugins/with-optional-portrait-feature.js'

permissions:
  contents: read

jobs:
  android-play-bundle:
    name: Build unsigned Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MANE_ANDROID_BUILD_COMMIT: ${{ github.sha }}
      MANE_AUTH_ENTRY: ${{ inputs.staging_auth && 'https://mane-auth-stg.disnana.com' || vars.MANE_AUTH_ENTRY }}
      MANE_GOOGLE_WEB_CLIENT_ID: ${{ inputs.staging_auth && '433981502913-fuq95bpmu1tf6sfir5ui28b0vrnk7npb.apps.googleusercontent.com' || vars.MANE_GOOGLE_WEB_CLIENT_ID }}
      MANE_GOOGLE_PROJECT_NUMBER: ${{ inputs.staging_auth && '433981502913' || vars.MANE_GOOGLE_PROJECT_NUMBER }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild --platform android --no-install
      - name: Audit and prepare the reviewed release build inputs
        id: audited_inputs
        if: >-
          inputs.release_authority_checks ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
           hashFiles('apps/mobile/release-verification/gradle.lockfile', 'apps/mobile/release-verification/verification-metadata.xml') != '')
        working-directory: .
        run: |
          gradle="$RUNNER_TEMP/gradle-9.4.1"
          evidence="$RUNNER_TEMP/release-quality"
          mkdir "$evidence"
          for input in verification-metadata.xml gradle.lockfile; do
            test -s "apps/mobile/release-verification/$input" || {
              echo "Missing reviewed Gradle input: $input" >&2
              exit 1
            }
          done
          install -m 644 apps/mobile/release-verification/verification-metadata.xml apps/mobile/android/gradle/
          install -m 644 apps/mobile/release-verification/gradle.lockfile apps/mobile/android/app/
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
          curl --fail --silent --show-error --location --max-time 180 \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o "$RUNNER_TEMP/mane-gradle.zip"
          printf '%s  %s\n' '2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb' \
            "$RUNNER_TEMP/mane-gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/mane-gradle.zip" -d "$RUNNER_TEMP"
          bun audit --json > "$evidence/bun-root.json"
          (cd apps/mobile && bun audit --json) > "$evidence/bun-mobile.json"
          (cd release-authority && bun audit --json) > "$evidence/bun-authority.json"
          bun install --frozen-lockfile
          bun run test
          printf 'RELEASE_GRADLE=%s\nRELEASE_EVIDENCE_DIR=%s\n' "$gradle/bin/gradle" "$evidence" >> "$GITHUB_ENV"
      - name: Build the bundle without Expo's development signing key
        working-directory: apps/mobile/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          text = path.read_text()
          begin = text.index('        release {')
          before, release = text[:begin], text[begin:]
          generated = '            signingConfig signingConfigs.debug\n'
          if release.count(generated) != 1:
              raise RuntimeError('Expo release signing template changed')
          path.write_text(before + release.replace(generated, '            signingConfig = null\n'))
          PY
          if [[ -n "${RELEASE_GRADLE:-}" ]]; then
            "$RELEASE_GRADLE" --no-daemon --no-configuration-cache --dependency-verification=strict \
              --init-script "$GITHUB_WORKSPACE/release-authority/tools/aab-verifier/release-dependencies.init.gradle" \
              :app:releaseDependencyInventory bundleRelease
          else
            ./gradlew bundleRelease --no-daemon
          fi
      - name: Check that the bundle has no development signature
        working-directory: apps/mobile/android
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('app/build/outputs/bundle/release/app-release.aab') as bundle:
              signed = [entry for entry in bundle.namelist() if entry.upper().startswith('META-INF/')
                        and entry.upper().endswith(('.SF', '.RSA', '.DSA', '.EC'))]
              if signed:
                  raise RuntimeError('Expected an unsigned App Bundle')
          PY
      - name: Audit Gradle dependencies and prepare release evidence
        if: steps.audited_inputs.outcome == 'success'
        working-directory: .
        run: bun release-authority/tools/aab-verifier/build-quality.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.audited_inputs.outcome == 'success'
        with:
          name: Mane-chan-release-quality-evidence
          path: |
            ${{ runner.temp }}/release-quality/quality.json
            ${{ runner.temp }}/release-quality/audit.json
            ${{ runner.temp }}/release-quality/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mane-chan-unsigned-app-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
