name: Mobile build (Android APK / iOS unsigned IPA)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The Expo CLI itself runs on Node
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - name: Generate native project
        run: bunx expo prebuild --platform android --no-install
      - name: Build release APK (debug-signed; for sideloading/testing)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DMM-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  ios:
    name: iOS unsigned IPA
    # iOS is distributed through Expo Go for now: build the native IPA only on demand
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The Expo CLI itself runs on Node
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Select the newest installed Xcode
        shell: bash
        working-directory: .
        run: |
          # Expo SDK 58 targets the latest Xcode; prefer Xcode 26+ when the image has it
          LATEST=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          echo "installed: $(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tr '\n' ' ')"
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build ExpoModulesJSI in Swift 5 mode
        # Xcode 26.3's Swift 6.2 rejects "sending 'slot' risks causing data races" in expo-modules-jsi
        # (JavaScriptObject.swift). Swift 5 language mode reports it as a warning; the code is unchanged.
        shell: bash
        run: |
          PKG=node_modules/expo-modules-jsi/apple/Package.swift
          grep -n 'swiftLanguageModes' "$PKG"
          sed -i 's/swiftLanguageModes: \[\.v6\]/swiftLanguageModes: [.v5]/' "$PKG"
          grep -n 'swiftLanguageModes' "$PKG"
      - name: Generate native project
        run: bunx expo prebuild --platform ios
      - name: Build (no code signing)
        shell: bash
        run: |
          WS=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Show the actual errors
        if: failure()
        shell: bash
        run: |
          grep -nE "error:|fatal error|\*\* BUILD FAILED|\[ExpoModulesJSI\]|Command .* failed|swift-.*error" "$RUNNER_TEMP/xcodebuild.log" | grep -v "Werror" | head -80 || true
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr DMM-mobile-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DMM-mobile-ios-unsigned-ipa
          path: apps/mobile/DMM-mobile-unsigned.ipa
          retention-days: 30
