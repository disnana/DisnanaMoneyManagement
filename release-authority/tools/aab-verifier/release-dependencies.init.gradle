import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import org.gradle.api.artifacts.dsl.LockMode

def releaseConfigurations = ['releaseCompileClasspath', 'releaseRuntimeClasspath'] as Set
gradle.beforeProject { project ->
    if (gradle.parent == null && project.name == 'react-native-keyboard-controller') {
        project.buildscript.configurations.named('classpath').configure {
            resolutionStrategy.eachDependency { dependency ->
                if (dependency.requested.group == 'com.android.tools.build' &&
                    dependency.requested.name == 'gradle' && dependency.requested.version == '4.2.2') {
                    dependency.useVersion('9.2.1')
                    dependency.because('Use the same Android Gradle plugin as the Expo application')
                }
            }
        }
    }
    if (gradle.parent == null && project.path == ':app') {
        project.dependencyLocking.lockMode = LockMode.STRICT
        project.configurations.configureEach {
            if (releaseConfigurations.contains(name)) resolutionStrategy.activateDependencyLocking()
        }
    }
}

gradle.projectsEvaluated {
    def app = gradle.parent == null ? gradle.rootProject.findProject(':app') : null
    if (app == null) return
    app.tasks.register('releaseDependencyInventory') {
        doLast {
            def configurations = releaseConfigurations.collect { app.configurations.getByName(it) }
            configurations += gradle.rootProject.allprojects.collect {
                it.buildscript.configurations.findByName('classpath')
            }.findAll { it != null && it.canBeResolved }
            def components = configurations.collectMany { configuration ->
                def result = configuration.incoming.resolutionResult
                if (result.allDependencies.any { it instanceof UnresolvedDependencyResult }) {
                    throw new GradleException("Unresolved component in ${configuration.name}")
                }
                result.allComponents.collect { it.id }.findAll { it instanceof ModuleComponentIdentifier }
            }.collect { [group: it.group, name: it.module, version: it.version] }
                .unique().sort { "${it.group}:${it.name}:${it.version}" }
            if (components.isEmpty()) throw new GradleException('Missing release dependency inventory')
            new File(System.getenv('RELEASE_EVIDENCE_DIR'), 'gradle-dependencies.json').text = JsonOutput.toJson(components)
        }
    }
}
