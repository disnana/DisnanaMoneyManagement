name: Release Authority AAB

on:
  workflow_run:
    workflows: ['Android Play closed-test draft']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, finalize]
        required: true
      build_run_id:
        description: Android Play build run ID
        type: string
        required: true
      verifier_run_id:
        description: Verifier run ID, required for finalize
        type: string
        required: false
      upload_to_play:
        description: Upload the independently verified signed AAB to Play
        type: boolean
        default: false

permissions: {}

jobs:
  authority:
    if: github.repository == 'disnana/DisnanaMoneyManagement' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      attestations: read
      id-token: write
    uses: disnana/DisnanaMoneyManagement/.github/workflows/release-authority-jobs.yml@e8c8630323069b0d627eccd5bc85db4f39a1c54e
    with:
      operation: ${{ inputs.operation || '' }}
      build_run_id: ${{ inputs.build_run_id || '' }}
      verifier_run_id: ${{ inputs.verifier_run_id || '' }}
      upload_to_play: ${{ inputs.upload_to_play || false }}
