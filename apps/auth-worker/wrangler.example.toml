name = "mane-auth-staging"
main = "index.mjs"
compatibility_date = "2026-11-23"
workers_dev = false
preview_urls = false
keep_vars = true
routes = [
  { pattern = "mane-auth-stg.disnana.com", custom_domain = true },
  { pattern = "dmm.disnana.com/api/shop/*", zone_name = "disnana.com" },
]

[vars]
# Set MANE_AUTH_NODES in the Dashboard with the actual origins and Scylla Host IDs.
# keep_vars preserves Dashboard bindings that are not declared in this file.
MANE_WEB_SHOP_ENABLED = "1"
SITE_ORIGIN = "https://dmm.disnana.com"
MANE_SHOP_TEST_MODE = "0"
# Shop secrets: GOOGLE_WEB_CLIENT_SECRET, STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET.
# Optional for tunnels protected by Access: set both MANE_SHOP_ACCESS_CLIENT_ID
# and MANE_SHOP_ACCESS_CLIENT_SECRET as Worker secrets.
