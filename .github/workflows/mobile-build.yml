name: Mobile build (Android APK / iOS unsigned IPA)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The Expo CLI itself runs on Node
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - name: Generate native project
        run: bunx expo prebuild --platform android --no-install
      - name: Build release APK (debug-signed; for sideloading/testing)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: DMM-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  ios:
    name: iOS unsigned IPA
    # iOS is distributed through Expo Go for now: build the native IPA only on demand
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Expo SDK 58 requires Xcode 26.4+; macos-26 provides this pinned version.
        xcode: ['26.4.1']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The Expo CLI itself runs on Node
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Select Xcode ${{ matrix.xcode }}
        shell: bash
        working-directory: .
        run: |
          APP="/Applications/Xcode_${{ matrix.xcode }}.app"
          echo "installed: $(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tr '\n' ' ')"
          if [ ! -d "$APP" ]; then echo "Xcode ${{ matrix.xcode }} is not installed on this runner"; exit 1; fi
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Generate native project
        run: bunx expo prebuild --platform ios
      - name: Build (no code signing)
        shell: bash
        run: |
          WS=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Show the actual errors
        if: failure()
        shell: bash
        run: |
          grep -nE "error:|fatal error|\*\* BUILD FAILED|\[ExpoModulesJSI\]|Command .* failed|swift-.*error" "$RUNNER_TEMP/xcodebuild.log" | grep -v "Werror" | head -80 || true
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcodebuild-log-${{ matrix.xcode }}
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr DMM-mobile-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: DMM-mobile-ios-unsigned-ipa-xcode${{ matrix.xcode }}
          path: apps/mobile/DMM-mobile-unsigned.ipa
          retention-days: 30
