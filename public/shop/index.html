<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f9f6">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://node-a-stg.disnana.com https://node-b-stg.disnana.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>クレジットショップ | マネーちゃん</title>
  <meta name="description" content="AIレシート用のクレジットを購入し、残高・有効期限・購入履歴を確認できます。">
  <link rel="canonical" href="https://dmm.disnana.com/shop/">
  <meta property="og:title" content="クレジットショップ | マネーちゃん">
  <meta property="og:description" content="AIレシート用のクレジットを購入し、残高・有効期限・購入履歴を確認できます。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dmm.disnana.com/shop/">
  <meta property="og:site_name" content="マネーちゃん">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:image" content="https://dmm.disnana.com/social/shop.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="マネーちゃんのAIクレジットショップ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="クレジットショップ | マネーちゃん">
  <meta name="twitter:description" content="AIレシート用のクレジットを購入し、残高・有効期限・購入履歴を確認できます。">
  <meta name="twitter:image" content="https://dmm.disnana.com/social/shop.png">
  <meta name="twitter:image:alt" content="マネーちゃんのAIクレジットショップ">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/portal/site.css?v=shop-entry">
  <link rel="stylesheet" href="/shop/shop.css?v=catalog-1">
  <script src="/shop/shop-nav.js" type="module"></script>
  <script src="/shop/shop-store-v3.js" type="module"></script>
</head>
<body class="shop-page" data-shop-direct>
  <header class="shop-bar"><div class="shell top">
    <a class="brand" href="/shop/" aria-label="マネーちゃん ショップトップ"><img src="/portal/mascot.png" alt="" width="36" height="36">マネーちゃん</a>
    <div class="shop-navigation">
      <button type="button" class="shop-menu-toggle" aria-expanded="false" aria-controls="shop-menu">
        <span class="shop-menu-icon" aria-hidden="true"></span>メニュー
      </button>
      <nav id="shop-menu" class="shop-menu" aria-label="ショップ内のページ">
        <a href="/shop/" aria-current="page">ショップ</a>
        <a href="/shop/history/">購入履歴</a>
        <a href="/shop/history/?type=activity">利用履歴</a>
        <a href="/app/" class="shop-menu-secondary">Web家計簿</a>
        <a href="/" class="shop-menu-secondary">公式トップ</a>
        <button id="logout" type="button" class="quiet" hidden>ログアウト</button>
      </nav>
    </div>
  </div></header>
  <main class="shell credit-shop shop-store">
    <header class="shop-intro">
      <h1>クレジットショップ</h1>
      <p>AIレシート用のクレジットを購入・管理できます。</p>
    </header>
    <noscript><p>残高や購入状況の表示にはJavaScriptが必要です。</p></noscript>
    <div class="shop-overview">
      <div class="wallet-column">
        <section id="wallet" class="wallet-panel" aria-labelledby="wallet-heading">
          <div class="credit-balance">
            <div class="balance-head">
              <h2 id="wallet-heading">利用可能なクレジット</h2>
              <button id="refresh" type="button" class="quiet balance-refresh" hidden>更新</button>
            </div>
            <div class="balance-content">
              <p class="balance-value" id="balance">—</p>
              <p id="login-note">Androidと同じGoogleアカウントで残高を確認できます。</p>
              <a id="login" class="button" href="/api/shop/auth/start">Googleでログイン</a>
            </div>
            <img class="balance-art" src="/portal/mascot.png" alt="" width="72" height="72">
          </div>
          <div id="wallet-expiry" class="wallet-expiry" hidden>
            <h3>有効期限</h3>
            <ul class="expiry-list" id="lots"></ul>
          </div>
        </section>
        <p id="status" class="wallet-status" role="status"></p>
      </div>
      <section class="packs-section" aria-labelledby="packs-heading">
        <div class="section-heading"><h2 id="packs-heading">クレジットを購入</h2><p id="pack-note" role="status"></p></div>
        <form id="checkout-form">
          <fieldset class="pack-selector">
            <legend class="sr-only">購入パック</legend>
            <ul class="pack-list" id="packs"></ul>
          </fieldset>
          <div id="checkout-action" class="checkout-action" hidden>
            <p id="checkout-selection" class="checkout-selection"></p>
            <button id="checkout-button" type="submit" class="button primary">決済へ進む</button>
            <p id="checkout-status" class="checkout-status" role="status"></p>
          </div>
        </form>
      </section>
      <details id="account-details" class="account-details" hidden>
        <summary>アカウントID</summary>
        <p id="account-id-help" class="muted">お問い合わせ時にお伝えください。</p>
        <div class="account-id-actions">
          <label for="account-id" class="sr-only">アカウントID</label>
          <input id="account-id" type="text" readonly spellcheck="false" autocomplete="off" aria-describedby="account-id-help">
          <button id="copy-account-id" type="button" class="quiet">コピー</button>
        </div>
        <p id="copy-status" class="muted" role="status"></p>
      </details>
    </div>
  </main>
  <footer class="shell footer"><a href="/">公式トップ</a><nav aria-label="公式情報"><a href="/terms/">利用規約</a><a href="/privacy/">プライバシーポリシー</a><a href="mailto:support@disnana.com">お問い合わせ</a></nav></footer>
</body>
</html>
