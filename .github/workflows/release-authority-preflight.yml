name: Release Authority preflight

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Existing Android Play build run ID
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    if: github.repository == 'disnana/DisnanaMoneyManagement' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the build and required evidence
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo 'Invalid build run ID'; exit 1; }
          gh api "/repos/disnana/DisnanaMoneyManagement/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          gh api --paginate --slurp "/repos/disnana/DisnanaMoneyManagement/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/build-artifacts.json"
          python3 release-authority/tools/aab-verifier/check-build-artifacts.py \
            "$RUNNER_TEMP/build-run.json" "$RUNNER_TEMP/build-artifacts.json"
