name: Build and Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache TypeScript & Vite build cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
            node_modules/.vite
          key: ${{ runner.os }}-build-cache-${{ github.ref_name }}-${{ hashFiles('tsconfig.json', 'vite.config.ts', 'src/**', 'index.html') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-${{ github.ref_name }}-
            ${{ runner.os }}-build-cache-

      - name: Install dependencies with Bun
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Resolve GitHub Pages base path
        id: base_path
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck (incremental cache)
        run: |
          mkdir -p .cache
          bunx tsc --noEmit --incremental --tsBuildInfoFile .cache/tsc.tsbuildinfo

      - name: Build PWA
        env:
          VITE_BASE_PATH: ${{ steps.base_path.outputs.value }}
        run: bun run build

      - name: Create SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
