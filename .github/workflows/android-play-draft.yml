name: Android Play closed-test draft

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: Sign and save a draft in Play Console
        type: boolean
        default: false
      staging_auth:
        description: Connect Android login to the staging service
        type: boolean
        default: false
      release_notes:
        description: Japanese Play release notes
        type: string
        required: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: android-play-closed-test
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/android-play-bundle.yml
    with:
      staging_auth: ${{ inputs.staging_auth }}

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      version_code: ${{ steps.bundle.outputs.version_code }}
      unsigned_sha: ${{ steps.bundle.outputs.unsigned_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Mane-chan-unsigned-app-bundle
          path: bundle
      - name: Verify the draft-only API behavior
        run: python3 -B -m unittest discover -s scripts -p test_android_play_draft.py
      - name: Verify the release identity in the AAB
        id: bundle
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=bundle/app-release.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=bundle/app-release.aab > "$RUNNER_TEMP/mane-manifest.xml"
          python3 scripts/android-play-build-info.py "$RUNNER_TEMP/mane-manifest.xml"
          echo "unsigned_sha=$(sha256sum bundle/app-release.aab | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Attest unsigned bundle provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bundle/app-release.aab

  play-draft:
    if: inputs.upload_to_play
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: google-play-closed
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Mane-chan-unsigned-app-bundle
          path: bundle
      - name: Sign and verify the Play upload certificate
        id: sign
        env:
          UNSIGNED_SHA: ${{ needs.verify.outputs.unsigned_sha }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          printf '%s  %s\n' "$UNSIGNED_SHA" bundle/app-release.aab | sha256sum --check
          : "${PLAY_UPLOAD_KEYSTORE_BASE64:?Add the Android upload keystore to the environment}"
          : "${PLAY_UPLOAD_STORE_PASSWORD:?Add the Android upload keystore password to the environment}"
          cert_sha=${PLAY_UPLOAD_CERT_SHA256//:/}
          cert_sha=${cert_sha,,}
          [[ "$cert_sha" =~ ^[0-9a-f]{64}$ ]] || { echo 'Set the Play upload certificate SHA-256'; exit 1; }
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/mane-upload.XXXXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          jarsigner -storetype PKCS12 -keystore "$keystore" -storepass:env PLAY_UPLOAD_STORE_PASSWORD \
            -signedjar bundle/mane-chan-signed.aab bundle/app-release.aab mane-chan-upload
          LC_ALL=C jarsigner -verify bundle/mane-chan-signed.aab > "$RUNNER_TEMP/mane-verify.txt"
          grep -Fx 'jar verified.' "$RUNNER_TEMP/mane-verify.txt"
          actual_cert_sha=$(keytool -printcert -rfc -jarfile bundle/mane-chan-signed.aab \
            | openssl x509 -outform der | sha256sum | cut -d ' ' -f 1)
          [[ "$actual_cert_sha" == "$cert_sha" ]] || { echo 'AAB signer does not match the Play upload certificate'; exit 1; }
          echo "certificate_sha=$actual_cert_sha" >> "$GITHUB_OUTPUT"
          echo "signed_sha=$(sha256sum bundle/mane-chan-signed.aab | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Attest signed bundle provenance
        id: signed_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bundle/mane-chan-signed.aab
      - name: Authenticate to Google Play
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Save a closed-test draft
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK }}
          PLAY_RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          VERSION_CODE: ${{ needs.verify.outputs.version_code }}
          UNSIGNED_SHA: ${{ needs.verify.outputs.unsigned_sha }}
          SIGNED_SHA: ${{ steps.sign.outputs.signed_sha }}
          CERT_SHA: ${{ steps.sign.outputs.certificate_sha }}
          ATTESTATION_URL: ${{ steps.signed_provenance.outputs.attestation-url }}
        run: |
          release_name="$RELEASE_VERSION ($VERSION_CODE) · ${GITHUB_SHA:0:12}"
          printf '%s  %s\n' "$SIGNED_SHA" bundle/mane-chan-signed.aab | sha256sum --check
          python3 scripts/android_play_draft.py bundle/mane-chan-signed.aab "$VERSION_CODE" "$release_name"
          {
            echo "### Google Play draft saved"
            printf '\n- Release: `%s`\n- Track: `%s`\n- Source commit: `%s`\n' "$release_name" "$PLAY_CLOSED_TRACK" "$GITHUB_SHA"
            printf -- '- Unsigned AAB SHA-256: `%s`\n- Signed AAB SHA-256: `%s`\n- Upload certificate SHA-256: `%s`\n' "$UNSIGNED_SHA" "$SIGNED_SHA" "$CERT_SHA"
            printf -- '- [Signed build provenance](%s)\n\nOpen Play Console to review and submit the draft.\n' "$ATTESTATION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
