name: Build and Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun global install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache TypeScript & Vite build cache
        uses: actions/cache@v6
        with:
          path: |
            .cache
            node_modules/.vite
          key: ${{ runner.os }}-build-cache-${{ github.ref_name }}-${{ hashFiles('tsconfig.json', 'vite.config.ts', 'src/**', 'index.html') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-${{ github.ref_name }}-
            ${{ runner.os }}-build-cache-

      - name: Install dependencies with Bun
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Resolve GitHub Pages base path
        id: base_path
        run: |
          PAGES_BASE="${{ steps.pages.outputs.base_path }}"
          CUSTOM_OVERRIDE="${{ vars.VITE_BASE_PATH }}"

          if [ -n "$CUSTOM_OVERRIDE" ]; then
            RESOLVED_BASE="$CUSTOM_OVERRIDE"
          elif [ -f "CNAME" ] || [ -f "public/CNAME" ]; then
            RESOLVED_BASE="/"
          elif [ -z "$PAGES_BASE" ] || [ "$PAGES_BASE" = "/" ]; then
            RESOLVED_BASE="/"
          else
            RESOLVED_BASE="${PAGES_BASE%/}/"
          fi

          # Ensure leading and trailing slash
          case "$RESOLVED_BASE" in
            /*) ;;
            *) RESOLVED_BASE="/$RESOLVED_BASE" ;;
          esac
          case "$RESOLVED_BASE" in
            */) ;;
            *) RESOLVED_BASE="$RESOLVED_BASE/" ;;
          esac

          echo "Resolved VITE_BASE_PATH=$RESOLVED_BASE (pages.base_path='$PAGES_BASE')"
          echo "value=$RESOLVED_BASE" >> "$GITHUB_OUTPUT"

      - name: Typecheck (incremental cache)
        run: |
          mkdir -p .cache
          bunx tsc --noEmit --incremental --tsBuildInfoFile .cache/tsc.tsbuildinfo

      - name: Unit tests
        run: bun run test

      - name: Audit production dependencies
        run: bun audit --production --audit-level=high

      - name: Build PWA
        env:
          VITE_BASE_PATH: ${{ steps.base_path.outputs.value }}
        run: bun run build

      - name: Create SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
