name: Release Authority checks
on:
  pull_request:
    paths:
      - release-authority/**
      - .github/workflows/release-authority-checks.yml
      - .github/workflows/release-authority-jobs.yml
      - .github/workflows/release-authority.yml
      - .github/workflows/android-play-draft.yml
      - scripts/android_play_draft.py
      - scripts/test_android_play_draft.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: release-authority
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: node --test --test-isolation=none tests/*.test.mjs
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -B -m unittest discover -s ../scripts -p test_android_play_draft.py
