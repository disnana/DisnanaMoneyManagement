name: Release Authority Gradle baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose:
    if: github.repository == 'disnana/DisnanaMoneyManagement' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate a proposed baseline without release permissions
        working-directory: apps/mobile
        run: |
          bun install --frozen-lockfile
          bunx expo prebuild --platform android --no-install
          curl --fail --silent --show-error --location --max-time 180 \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o "$RUNNER_TEMP/mane-gradle.zip"
          printf '%s  %s\n' '2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb' \
            "$RUNNER_TEMP/mane-gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/mane-gradle.zip" -d "$RUNNER_TEMP"
          export RELEASE_EVIDENCE_DIR="$RUNNER_TEMP/mane-gradle-baseline"
          mkdir "$RELEASE_EVIDENCE_DIR"
          cd android
          "$RUNNER_TEMP/gradle-9.4.1/bin/gradle" --no-daemon --write-locks --write-verification-metadata sha256 \
            --init-script "$GITHUB_WORKSPACE/release-authority/tools/aab-verifier/release-dependencies.init.gradle" \
            :app:releaseDependencyInventory bundleRelease
          install -m 644 gradle/verification-metadata.xml app/gradle.lockfile "$RELEASE_EVIDENCE_DIR/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mane-chan-gradle-baseline-for-review
          path: ${{ runner.temp }}/mane-gradle-baseline
          if-no-files-found: error
          retention-days: 7
