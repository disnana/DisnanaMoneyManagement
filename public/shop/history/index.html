<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f9f6">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>クレジット履歴 | マネーちゃん</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/portal/site.css">
  <link rel="stylesheet" href="/shop/shop.css?v=history-1">
  <script src="/shop/history.js" type="module"></script>
</head>
<body class="shop-page">
  <header class="shop-bar"><div class="shell top">
    <a class="brand" href="/"><img src="/portal/mascot.png" alt="" width="36" height="36">マネーちゃん</a>
    <nav aria-label="主要ページ"><a href="/shop/">ショップに戻る</a></nav>
  </div></header>
  <main class="shell credit-shop history-page">
    <header class="shop-intro"><h1 id="history-heading" tabindex="-1">クレジット履歴</h1></header>
    <nav class="history-nav" aria-label="履歴の種類">
      <a id="orders-link" href="/shop/history/">購入履歴</a>
      <a id="activity-link" href="?type=activity">利用履歴</a>
    </nav>
    <p id="checkout-return" class="history-notice" hidden></p>
    <noscript><p>履歴の表示にはJavaScriptが必要です。</p></noscript>
    <div class="shop-feedback">
      <p id="status" role="status">履歴を読み込み中…</p>
      <button id="refresh" type="button" class="quiet" hidden>再読み込み</button>
    </div>
    <a id="login" class="button" href="/shop/" hidden>ショップでログイン</a>
    <ul class="records" id="records" aria-labelledby="history-heading" hidden></ul>
    <nav id="pagination" class="pagination" aria-label="履歴のページ" hidden>
      <button id="previous" class="button" type="button">前へ</button>
      <span id="page-number" aria-live="polite"></span>
      <button id="next" class="button" type="button">次へ</button>
    </nav>
  </main>
  <footer class="shell footer"><a href="/shop/">クレジットショップ</a><nav aria-label="公式情報"><a href="/terms/">利用規約</a><a href="/privacy/">プライバシーポリシー</a><a href="mailto:support@disnana.com">お問い合わせ</a></nav></footer>
</body>
</html>
