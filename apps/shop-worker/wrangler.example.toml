name = "mane-credit-shop-staging"
main = "index.mjs"
compatibility_date = "2026-11-23"
workers_dev = false
preview_urls = false
routes = [{ pattern = "dmm.disnana.com/api/shop/*", zone_name = "disnana.com" }]

[vars]
SITE_ORIGIN = "https://dmm.disnana.com"
MANE_BACKEND_ORIGIN = "https://node-a-stg.disnana.com"
MANE_SHOP_TEST_MODE = "0"
MANE_SHOP_PACKS = "[]"

[[d1_databases]]
binding = "DB"
database_name = "mane-credit-shop-staging"
database_id = "REPLACE_WITH_D1_ID"

[triggers]
crons = ["*/10 * * * *"]
