name: Release Authority Gradle baseline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-authority-gradle-baseline.yml'
      - 'apps/mobile/**'
      - 'release-authority/tools/aab-verifier/release-dependencies.init.gradle'

permissions:
  contents: read

jobs:
  propose:
    if: >-
      github.repository == 'disnana/DisnanaMoneyManagement' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate a proposed baseline without release permissions
        working-directory: apps/mobile
        run: |
          bun install --frozen-lockfile
          bunx expo prebuild --platform android --no-install
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
          curl --fail --silent --show-error --location --max-time 180 \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o "$RUNNER_TEMP/mane-gradle.zip"
          printf '%s  %s\n' '2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb' \
            "$RUNNER_TEMP/mane-gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/mane-gradle.zip" -d "$RUNNER_TEMP"
          export RELEASE_EVIDENCE_DIR="$RUNNER_TEMP/mane-gradle-baseline"
          mkdir "$RELEASE_EVIDENCE_DIR"
          cd android
          "$RUNNER_TEMP/gradle-9.4.1/bin/gradle" --no-daemon --no-configuration-cache --write-locks --write-verification-metadata sha256 \
            --init-script "$GITHUB_WORKSPACE/release-authority/tools/aab-verifier/release-dependencies.init.gradle" \
            :app:releaseDependencyInventory bundleRelease
          install -m 644 gradle/verification-metadata.xml app/gradle.lockfile "$RELEASE_EVIDENCE_DIR/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mane-chan-gradle-baseline-for-review
          path: ${{ runner.temp }}/mane-gradle-baseline
          if-no-files-found: error
          retention-days: 7
