      <p class="topic-intro">写真をレシートごとにまとめて送り、店舗・日付・金額・品目を確認してから家計簿に登録する機能を開発予定です。</p>

        <figcaption><h2 id="receipt-title">撮影から記録までの設計</h2><p id="receipt-description">Goがレシートごとに画像を解析し、結果をチェックします。利用者は原本と照合したうえで、合計か商品単位で記録します。</p></figcaption>
      </figure>
      <section class="takeaways" aria-labelledby="notes">
        <h2 id="notes">しくみのポイント</h2>
        <ul>
          <li>通常は画像1枚につき基本1cr。長いレシートを2枚に分けた場合は基本2crです。</li>
          <li>送信前に利用可能残高、消費の見込み、上限を確認します。見積もりとの差で上限を超えた費用は運営側が負担します。</li>
