name: mane_chan_prototype
description: Mane-chan personal finance app for iOS and Android.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  file_selector: ^1.1.0
  charset: ^2.0.1
  csv: ^6.0.0
  crypto: ^3.0.8
  local_auth: ^3.0.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mane-start.png
    - assets/launcher/
    - assets/guide/
