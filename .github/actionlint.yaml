# actionlint 1.7.7 predates the GitHub-hosted macOS 26 runner.
self-hosted-runner:
  labels:
    - macos-26

# These GitHub.com job context fields were added after the pinned actionlint release.
paths:
  .github/workflows/release-authority-jobs.yml:
    ignore:
      - '^property "workflow_(repository|sha)" is not defined in object type'
