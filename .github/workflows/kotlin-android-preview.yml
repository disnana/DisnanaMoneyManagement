name: Kotlin Android prototype

on:
  push:
    branches: [prototype/kotlin-android]
    paths:
      - 'apps/kotlin-android/**'
      - '.github/workflows/kotlin-android-preview.yml'

permissions:
  contents: read

concurrency:
  group: kotlin-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/kotlin-android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mane-chan-Kotlin-debug-APK
          path: apps/kotlin-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
