name: Pinned Release Authority jobs

on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: false
      build_run_id:
        type: string
        required: false
      verifier_run_id:
        type: string
        required: false
      upload_to_play:
        type: boolean
        default: false

permissions: {}

env:
  RELEASE_SOURCE_SHA: ${{ github.sha }}
  RELEASE_UPLOAD_CERTIFICATE_PEM: ${{ vars.RELEASE_UPLOAD_CERTIFICATE_PEM }}
  RELEASE_UPLOAD_CERTIFICATE_SHA256: ${{ vars.RELEASE_UPLOAD_CERTIFICATE_SHA256 }}
  RELEASE_UPLOAD_KEY_ID: ${{ vars.RELEASE_UPLOAD_KEY_ID }}
  RELEASE_TARGET_TRACK: ${{ vars.RELEASE_TARGET_TRACK }}
  RELEASE_STATUS: ${{ vars.RELEASE_STATUS }}
  RELEASE_POLICY_VERSION: ${{ vars.RELEASE_POLICY_VERSION }}
  BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}

jobs:
  verify:
    if: >-
      github.repository == 'disnana/DisnanaMoneyManagement' && github.ref == 'refs/heads/main' &&
      (inputs.operation == 'verify' ||
       (github.event_name == 'workflow_run' && vars.RELEASE_AUTO_VERIFY == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'workflow_dispatch' ||
         (github.event.workflow_run.event == 'push' && vars.RELEASE_AUTO_BUILD == 'true')) &&
        github.event.workflow_run.path == '.github/workflows/android-play-draft.yml' &&
        github.event.workflow_run.head_repository.id == 1462301394 && github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: release-authority-verifier
    permissions:
      actions: read
      contents: read
      attestations: read
      id-token: write
    steps:
      - name: Require an immutable authority checkout
        env:
          AUTHORITY_REPOSITORY: ${{ job.workflow_repository }}
          AUTHORITY_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$AUTHORITY_REPOSITORY" == "$GITHUB_REPOSITORY" && "$AUTHORITY_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the checksum-pinned signing JDK
        run: bash release-authority/tools/remote-jarsigner/install-ci-jdk.sh
      - name: Check that the upstream build opted into release auditing
        if: github.event_name == 'workflow_run'
        id: release_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          available=$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" |
            jq 'any(.[].artifacts[]; .name == "Mane-chan-release-quality-evidence" and .expired == false)')
          printf 'available=%s\n' "$available" >> "$GITHUB_OUTPUT"
      - name: Verify source artifacts and generate signing evidence
        if: steps.release_evidence.outputs.available != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTHORITY_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash release-authority/tools/aab-verifier/prepare-ci.sh
          out="$RUNNER_TEMP/mane-authority"
          digest=$(node release-authority/tools/aab-verifier/ci-manifest.mjs validate)
          version_name=$(jq -er .versionName "$out/quality.json")
          version_code=$(jq -er .versionCode "$out/quality.json")
          python3 release-authority/tools/aab-verifier/verify.py --bundletool "$out/tools/bundletool.jar" \
            --package com.disnana.mane_chan --version-name "$version_name" --version-code "$version_code" \
            --commit "$RELEASE_SOURCE_SHA" --unsigned "$out/app-release.aab" --sha256 "$digest"
          RELEASE_ISSUED_AT=$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')
          export RELEASE_ISSUED_AT
          java -cp "$out/classes:$out/tools/*" DeterministicAab capture \
            "$out/app-release.aab" "$out/certificate.pem" "$RELEASE_ISSUED_AT" "$out/proof"
          node release-authority/tools/aab-verifier/ci-manifest.mjs create
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release_evidence.outputs.available != 'false'
        with:
          name: Mane-chan-release-manifest
          path: ${{ runner.temp }}/mane-authority/manifest.json
          if-no-files-found: error
          retention-days: 2
      - name: Register the approval request
        if: steps.release_evidence.outputs.available != 'false'
        env:
          RELEASE_VERIFIER_SECRET: ${{ secrets.RELEASE_VERIFIER_SECRET }}
        run: |
          registration=$(node release-authority/tools/aab-verifier/register-staging.mjs "$RUNNER_TEMP/mane-authority/manifest.json")
          jq -er '
            select(.approvalUrl | type == "string" and startswith("https://release-stg.disnana.com/approve/")) |
            "[承認画面](\(.approvalUrl))\n\nManifest SHA-256 `\(.releaseHash)`"
          ' <<< "$registration" >> "$GITHUB_STEP_SUMMARY"

  finalize:
    if: inputs.operation == 'finalize' && github.repository == 'disnana/DisnanaMoneyManagement' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: release-authority-finalizer
    permissions:
      actions: read
      contents: read
      attestations: read
      id-token: write
    outputs:
      signed_sha256: ${{ steps.finalize.outputs.sha256 }}
    steps:
      - name: Require an immutable authority checkout
        env:
          AUTHORITY_REPOSITORY: ${{ job.workflow_repository }}
          AUTHORITY_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$AUTHORITY_REPOSITORY" == "$GITHUB_REPOSITORY" && "$AUTHORITY_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the checksum-pinned signing JDK
        run: bash release-authority/tools/remote-jarsigner/install-ci-jdk.sh
      - name: Recheck source artifacts and verifier run
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_RUN_ID: ${{ inputs.verifier_run_id }}
        run: |
          [[ "$VERIFIER_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$VERIFIER_RUN_ID" != "$GITHUB_RUN_ID" ]]
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIER_RUN_ID" |
            jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '.conclusion == "success" and (.event == "workflow_dispatch" or .event == "workflow_run") and
               .path == ".github/workflows/release-authority.yml" and .head_branch == "main" and
               .head_sha == $sha and .head_repository.full_name == $repo' >/dev/null
          bash release-authority/tools/aab-verifier/prepare-ci.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mane-chan-release-manifest
          path: ${{ runner.temp }}/mane-authority
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verifier_run_id }}
      - name: Sign and verify the exact approved AAB
        id: finalize
        env:
          RELEASE_FINALIZER_SECRET: ${{ secrets.RELEASE_FINALIZER_SECRET }}
          RELEASE_AUTHORITY_WORKFLOW_SHA: ${{ job.workflow_sha }}
          VERIFIER_RUN_ID: ${{ inputs.verifier_run_id }}
        run: |
          out="$RUNNER_TEMP/mane-authority"
          jq -e --arg id "$VERIFIER_RUN_ID" '.verifierRunId == $id' "$out/manifest.json" >/dev/null
          issued_at=$(jq -er .issuedAt "$out/manifest.json")
          digest=$(node release-authority/tools/aab-verifier/ci-manifest.mjs validate)
          version_name=$(jq -er .versionName "$out/quality.json")
          version_code=$(jq -er .versionCode "$out/quality.json")
          verify=(python3 release-authority/tools/aab-verifier/verify.py --bundletool "$out/tools/bundletool.jar"
            --package com.disnana.mane_chan --version-name "$version_name" --version-code "$version_code"
            --commit "$RELEASE_SOURCE_SHA" --unsigned "$out/app-release.aab" --sha256 "$digest")
          "${verify[@]}"
          assembly=(java -cp "$out/classes:$out/tools/*" DeterministicAab)
          "${assembly[@]}" capture "$out/app-release.aab" "$out/certificate.pem" "$issued_at" "$out/proof"
          node release-authority/tools/aab-verifier/ci-manifest.mjs compare
          node release-authority/tools/remote-jarsigner/finalize-staging.mjs \
            "$out/manifest.json" "$out/proof/input.bin" "$out/signature.bin"
          "${assembly[@]}" finalize-signature "$out/app-release.aab" "$out/certificate.pem" "$issued_at" \
            "$out/proof" "$out/mane-chan-signed.aab" "$out/signature.bin"
          "${verify[@]}" --signed "$out/mane-chan-signed.aab"
          LC_ALL=C jarsigner -verify "$out/mane-chan-signed.aab" > "$out/jarsigner.log"
          grep -Fx 'jar verified.' "$out/jarsigner.log"
          printf 'sha256=%s\n' "$(sha256sum "$out/mane-chan-signed.aab" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mane-chan-authority-signed-aab
          path: |
            ${{ runner.temp }}/mane-authority/mane-chan-signed.aab
            ${{ runner.temp }}/mane-authority/manifest.json
            ${{ runner.temp }}/mane-authority/signature.bin
          if-no-files-found: error
          retention-days: 2

  upload:
    if: inputs.upload_to_play
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: release-authority-play
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: android-play-closed-test
      cancel-in-progress: false
    steps:
      - name: Require an immutable authority checkout
        env:
          AUTHORITY_REPOSITORY: ${{ job.workflow_repository }}
          AUTHORITY_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$AUTHORITY_REPOSITORY" == "$GITHUB_REPOSITORY" && "$AUTHORITY_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install the pinned receipt verifier
        working-directory: release-authority
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mane-chan-authority-signed-aab
          path: signed
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Save the verified bundle using the approved Play action
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SIGNED_SHA256: ${{ needs.finalize.outputs.signed_sha256 }}
          RELEASE_PUBLISHER_SECRET: ${{ secrets.RELEASE_PUBLISHER_SECRET }}
          RELEASE_RECEIPT_PUBLIC_SPKI_PEM: ${{ vars.RELEASE_RECEIPT_PUBLIC_SPKI_PEM }}
          RELEASE_RECEIPT_KEY_ID: ${{ vars.RELEASE_RECEIPT_KEY_ID }}
        run: |
          printf '%s  %s\n' "$SIGNED_SHA256" signed/mane-chan-signed.aab | sha256sum -c -
          audit=(node release-authority/tools/remote-jarsigner/record-play-upload.mjs)
          evidence=(signed/manifest.json signed/signature.bin "$SIGNED_SHA256")
          mode=$(jq -er '
            if .releaseStatus == "internal-draft" and .targetTrack == "internal" then "--internal-draft"
            elif .releaseStatus == "upload-only" then "--bundle-only"
            else error("Unsupported approved Play operation") end
          ' signed/manifest.json)
          version_code=$(jq -er .versionCode signed/manifest.json)
          play=(python3 scripts/android_play_draft.py "$mode"
            signed/mane-chan-signed.aab "$version_code" "$SIGNED_SHA256")
          if [[ "$mode" == --internal-draft ]]; then
            result=$("${play[@]}" signed/manifest.json signed/signature.bin)
          else
            "${audit[@]}" start "${evidence[@]}"
            result=$("${play[@]}")
          fi
          case "$result" in
            'Bundle stored:'*) status=stored ;;
            'Bundle already_present:'*) status=already_present ;;
            *) echo 'Unexpected upload outcome. Inspect Play Console before retrying.' >&2; exit 1 ;;
          esac
          "${audit[@]}" finish "${evidence[@]}" "$status" > signed/release-receipt.jws
          printf '%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$mode" == --internal-draft ]]; then
            printf '%s\n' 'Verified Play internal-testing draft. Distribution requires a Play Console action.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mane-chan-Play-upload-receipt
          path: signed/release-receipt.jws
          if-no-files-found: error
          retention-days: 30
